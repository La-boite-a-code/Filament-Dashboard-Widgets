name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        filament: ['4', '5']
        dependency-version: [prefer-stable]
        include:
          - php: '8.4'
            filament: '5'
            dependency-version: prefer-lowest
          - php: '8.3'
            filament: '4'
            dependency-version: prefer-lowest

    name: PHP ${{ matrix.php }} - Filament ${{ matrix.filament }} - ${{ matrix.dependency-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, intl, gd
          coverage: none

      - name: Select the Filament major version
        run: composer require "filament/filament:${{ matrix.filament == '4' && '^4.12' || '^5.7.1' }}" --no-update --no-interaction

      - name: Install dependencies
        run: composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest
